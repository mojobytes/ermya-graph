name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: "1.88"

jobs:
  brand-residue:
    name: Reject retired brand residue
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install --yes ripgrep
      - name: Check active tree
        run: bash scripts/check_brand_residue.sh

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # Measure parser/cache throughput in the optimized profile, using the
      # existing release thresholds. Keep functional coverage in debug builds.
      - run: cargo test --workspace --exclude ermya-graph-python --features plain-tcp --locked -- --skip tests::gql_native_fastpath_throughput_regression_guard --skip tests::parse_cached_throughput_regression_guard
      - run: cargo test --release --locked -p ermya-graph-cypher --lib throughput_regression_guard -- --test-threads=1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.15.2"
      - name: Verify transaction integrity with the official Bolt driver
        run: |
          python3 -m pip install neo4j==4.4.11
          cargo build --locked -p ermya-graph-server --bin ermya-graph-server
          python3 scripts/test_issue14_bolt.py target/debug/ermya-graph-server
      - name: Verify BEGIN and pattern parameters with the modern Bolt driver
        run: |
          python3 -m pip install neo4j==6.4.1
          python3 scripts/test_issue10_bolt.py target/debug/ermya-graph-server
          python3 scripts/test_issue11_bolt.py target/debug/ermya-graph-server
      - run: cargo package -p ermya-graph --locked
      - uses: taiki-e/install-action@cargo-audit
      - run: cargo audit

  python:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.15.2"
            os: ubuntu-latest
          - python-version: "3.12"
            os: ubuntu-24.04
          - python-version: "3.9"
            os: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - uses: Swatinem/rust-cache@v2
      - run: python -m pip install 'maturin>=1.7,<2.0' pytest
      - run: maturin build --locked --out dist --manifest-path crates/ermya-graph-python/Cargo.toml
      - run: python -m pip install dist/*.whl
      - run: python -m pytest crates/ermya-graph-python/tests -q

  python-container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --target test -f crates/ermya-graph-python/Dockerfile .
